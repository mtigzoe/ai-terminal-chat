name: Security Git config fix 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix verification dependency
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/security-git-config-fix.yml')
          s = p.read_text(encoding='utf-8')
          old = '          python -m pytest -q server-python/tests/test_git_config_security.py\n'
          new = '          python -m pip install -q pytest\n          python -m pytest -q server-python/tests/test_git_config_security.py\n'
          if old not in s:
              raise SystemExit('pytest verification line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/security-git-config-fix.yml
          git commit -m "ci: install pytest for Git config regression verification"
          git push origin main
