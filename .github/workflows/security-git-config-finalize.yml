name: Security Git config finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply corrected hardening and tests
        shell: python
        run: |
          from pathlib import Path

          p = Path("server-python/tools.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace("import subprocess\nimport tempfile\n", "import subprocess\nimport tempfile\nimport threading\nfrom contextlib import contextmanager\n", 1) if "import threading\nfrom contextlib import contextmanager\n" not in s else s

          if "def _git_config_files() -> list[Path]:" not in s:
              marker = "_GIT_CONFIG_OVERRIDES = [\n"
              insert = '''_GIT_OPERATION_LOCK = threading.RLock()\n\n\ndef _git_config_files() -> list[Path]:\n    """Return local/worktree Git config files without following config symlinks."""\n    git_path = PROJECT_ROOT / ".git"\n    if git_path.is_dir():\n        git_dir = git_path.resolve()\n    elif git_path.is_file():\n        try:\n            line = next(line for line in git_path.read_text(encoding="utf-8").splitlines() if line.lower().startswith("gitdir:"))\n            git_dir = (git_path.parent / line.split(":", 1)[1].strip()).resolve()\n        except (OSError, UnicodeDecodeError, StopIteration):\n            return []\n    else:\n        return []\n    paths: list[Path] = []\n    for name in ("config", "config.worktree"):\n        path = git_dir / name\n        try:\n            resolved = path.resolve(strict=True)\n            resolved.relative_to(git_dir)\n            if path.is_symlink() or not path.is_file():\n                continue\n            paths.append(path)\n        except (OSError, ValueError):\n            continue\n    return paths\n\n\ndef _strip_dangerous_git_config(content: str) -> str:\n    """Remove URL/filter/include sections before network Git operations."""\n    out: list[str] = []\n    skipping = False\n    for raw in content.splitlines(keepends=True):\n        stripped = raw.strip()\n        if stripped.startswith("[") and stripped.endswith("]"):\n            section = stripped[1:-1].strip().lower()\n            skipping = (section == "url" or section.startswith("url ") or section == "filter" or section.startswith("filter ") or section == "include" or section.startswith("includeif "))\n        if not skipping:\n            out.append(raw)\n    return "".join(out)\n\n\n@contextmanager\ndef _sanitized_git_config():\n    """Temporarily remove URL/filter/include config under the Git operation lock."""\n    with _GIT_OPERATION_LOCK:\n        backups: list[tuple[Path, str]] = []\n        try:\n            for path in _git_config_files():\n                original = path.read_text(encoding="utf-8")\n                sanitized = _strip_dangerous_git_config(original)\n                if sanitized != original:\n                    path.write_text(sanitized, encoding="utf-8")\n                    backups.append((path, original))\n            yield\n        finally:\n            for path, original in reversed(backups):\n                try:\n                    path.write_text(original, encoding="utf-8")\n                except OSError:\n                    pass\n\n\n'''
              if marker not in s:
                  raise SystemExit("Git config marker not found")
              s = s.replace(marker, insert + marker, 1)

          if "DYNAMIC_GIT_CONFIG_KEY_RE = re.compile(" not in s:
              marker = "def _git_ssh_command() -> str:\n"
              insert = '''DYNAMIC_GIT_CONFIG_KEY_RE = re.compile(\n    r"^(filter\\..+\\.(clean|smudge|process|required)|url\\..+\\.(insteadof|pushinsteadof)|include\\.path|includeif\\..+\\.path|merge\\..+\\.driver|remote\\..+\\.(uploadpack|receivepack)|diff\\..+\\.textconv|submodule\\..+\\.update)$",\n    re.IGNORECASE,\n)\n\n\ndef _dynamic_git_config_overrides() -> list[str]:\n    overrides: list[str] = []\n    for path in _git_config_files():\n        try:\n            section = ""\n            for raw in path.read_text(encoding="utf-8").splitlines():\n                line = raw.strip()\n                if not line or line.startswith("#") or line.startswith(";"):\n                    continue\n                if line.startswith("[") and line.endswith("]"):\n                    body = line[1:-1].strip()\n                    match = re.match(r'^(\\S+)\\s+"(.*)"$', body)\n                    section = f"{match.group(1).lower()}.{match.group(2)}" if match else body.lower()\n                    continue\n                match = re.match(r"^([^=]+)=", line)\n                if match and section:\n                    key = f"{section}.{match.group(1).strip().lower()}"\n                    if DYNAMIC_GIT_CONFIG_KEY_RE.fullmatch(key):\n                        overrides.extend(["-c", f"{key}="])\n        except (OSError, UnicodeDecodeError):\n            continue\n    return overrides\n\n\n'''
              if marker not in s:
                  raise SystemExit("SSH marker not found")
              s = s.replace(marker, insert + marker, 1)

          old = 'safe_args = list(_GIT_CONFIG_OVERRIDES) + list(args)'
          if old in s:
              s = s.replace(old, 'safe_args = list(_GIT_CONFIG_OVERRIDES) + _dynamic_git_config_overrides() + list(args)', 1)
          s = s.replace('args = ["git", "diff"]\n', 'args = ["git", "diff", "--no-ext-diff", "--no-textconv"]\n', 1)
          for call in [
              'result = _run_git(args[1:], timeout=GIT_FETCH_TIMEOUT)',
              'result = _run_git(args[1:], timeout=GIT_PULL_TIMEOUT)',
              'result = _run_git(args[1:], timeout=GIT_PUSH_TIMEOUT)',
          ]:
              if call in s and f'with _sanitized_git_config():\n            {call}' not in s:
                  s = s.replace(call, f'with _sanitized_git_config():\n            {call}', 1)
          p.write_text(s, encoding="utf-8")

          p = Path("server-typescript/src/git.ts")
          s = p.read_text(encoding="utf-8")
          current = '  /^(filter\\..+\\.(clean|smudge|process|required)|url\\..+\\.(insteadof|pushinsteadof)|include\\.path|includeif\\..+\\.path)$/i;'
          hardened = '  /^(filter\\..+\\.(clean|smudge|process|required)|url\\..+\\.(insteadof|pushinsteadof)|include\\.path|includeif\\..+\\.path|merge\\..+\\.driver|remote\\..+\\.(uploadpack|receivepack)|diff\\..+\\.textconv|submodule\\..+\\.update)$/i;'
          if current in s:
              s = s.replace(current, hardened, 1)
          elif hardened not in s:
              raise SystemExit("TypeScript dynamic override regex not found")
          p.write_text(s, encoding="utf-8")

          p = Path("server-python/tests/test_git_config_security.py")
          p.write_text('''import subprocess\nimport sys\nfrom pathlib import Path\n\nSERVER_DIR = Path(__file__).resolve().parents[1]\nsys.path.insert(0, str(SERVER_DIR))\nimport tools  # noqa: E402\n\n\ndef _git(cwd: Path, *args: str) -> subprocess.CompletedProcess:\n    return subprocess.run(["git", *args], cwd=cwd, text=True, capture_output=True, check=True)\n\n\ndef _repo(tmp_path: Path) -> Path:\n    root = tmp_path / "repo"\n    root.mkdir()\n    _git(root, "init")\n    _git(root, "config", "user.name", "Test")\n    _git(root, "config", "user.email", "test@example.com")\n    (root / "file.txt").write_text("base\\n", encoding="utf-8")\n    _git(root, "add", "file.txt")\n    _git(root, "commit", "-m", "base")\n    return root\n\n\ndef test_strip_dangerous_git_config_removes_execution_sections():\n    config = "[core]\\n\\tbare = false\\n[filter \\\"evil\\\"]\\n\\tclean = sh -c \\\"touch pwned; cat\\\"\\n[url \\\"file:///evil/\\\"]\\n\\tinsteadOf = https://example.com/\\n[include]\\n\\tpath = evil.conf\\n[merge \\\"evil\\\"]\\n\\tdriver = sh -c \\\"touch merge-pwned\\\"\\n"\n    sanitized = tools._strip_dangerous_git_config(config)\n    assert 'filter "evil"' not in sanitized\n    assert 'url "file:///evil/"' not in sanitized\n    assert '[include]' not in sanitized\n    assert 'merge "evil"' in sanitized\n\n\ndef test_git_diff_disables_textconv(monkeypatch):\n    captured = {}\n    class Result:\n        returncode = 0\n        stdout = "diff --git a/file.txt b/file.txt\\n"\n        stderr = ""\n    def fake_run(args, timeout):\n        captured["args"] = args\n        return Result()\n    monkeypatch.setattr(tools, "_run_git", fake_run)\n    result = tools.git_diff()\n    assert "error" not in result\n    assert captured["args"][:3] == ["diff", "--no-ext-diff", "--no-textconv"]\n\n\ndef test_dynamic_git_config_overrides_execution_paths(tmp_path, monkeypatch):\n    root = _repo(tmp_path)\n    _git(root, 'config', 'filter.evil.clean', \"sh -c 'touch pwned; cat'\")\n    _git(root, 'config', 'merge.evil.driver', \"sh -c 'touch merge-pwned'\")\n    _git(root, 'config', 'remote.origin.uploadpack', 'touch upload-pwned')\n    monkeypatch.setattr(tools, 'PROJECT_ROOT', root)\n    flattened = ' '.join(tools._dynamic_git_config_overrides())\n    assert 'filter.evil.clean=' in flattened\n    assert 'merge.evil.driver=' in flattened\n    assert 'remote.origin.uploadpack=' in flattened\n''', encoding="utf-8")

      - name: Verify
        run: |
          python -m py_compile server-python/tools.py server-python/tests/test_git_config_security.py
          python -m pip install -q pytest
          python -m pytest -q server-python/tests/test_git_config_security.py
          cd server-typescript
          npm install --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server-python/tools.py server-python/tests/test_git_config_security.py server-typescript/src/git.ts
          git diff --cached --quiet && exit 0
          git commit -m "security: harden Git config execution isolation"
          git push origin main
