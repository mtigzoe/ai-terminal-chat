name: CI

on:
  push:
    branches:
      - main
      - bugsv1
      - nvidia
  pull_request:
    branches:
      - main
      - bugsv1
      - nvidia

jobs:
  server-typescript:
    name: server-typescript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test -- --run
      - name: Build
        run: npm run build

  server-typescript-windows:
    name: server-typescript Windows security tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build test runtime
        run: npm run build
      - name: Run security regression tests
        run: npx tsx --test src/config.test.ts src/security.test.ts src/filesystem.test.ts src/git.test.ts src/terminal.git-isolation.test.ts src/terminal.env-isolation.test.ts src/trusted-exec.test.ts src/windows-handle-path.test.ts src/safe-fetch.test.ts
      - name: Verify configuration isolation across backend processes
        run: npx vitest run tests/config-profile-isolation.test.ts

  client-react:
    name: client-react tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run Electron security regression tests
        run: |
          node tests/external-url.test.cjs
          node tests/project-path.test.cjs
          node tests/editor-open.test.cjs
          node tests/backend-lifecycle.test.cjs
      - name: Run tests
        run: npm test -- --run
      - name: Build
        run: npm run build

  electron-security-windows:
    name: Electron security tests on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install client test dependencies
        working-directory: client-react
        # These tests use Node/jsdom and temporary shims, not the Electron binary.
        run: npm ci --ignore-scripts
      - name: Run Electron security regression tests
        working-directory: client-react
        run: |
          node tests/external-url.test.cjs
          node tests/project-path.test.cjs
          node tests/editor-open.test.cjs
          node tests/backend-lifecycle.test.cjs
      - name: Run React and Electron helper tests
        working-directory: client-react
        run: npm test -- --run

  electron-package-windows:
    name: Windows Electron portable packaging
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install client dependencies
        working-directory: client-react
        run: npm ci
      - name: Build portable application from clean checkout
        working-directory: client-react
        run: npm run electron:build:win:portable
      - name: Verify TypeScript backend and executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'client-react/release/win-unpacked/resources/server-typescript/dist/server.js')) {
            throw 'Packaged Electron is missing the TypeScript backend'
          }
          $portable = Get-ChildItem 'client-react/release' -Filter '*Portable*.exe' -File
          if (-not $portable) { throw 'Portable Windows executable not found' }
