name: CI

on:
  push:
    branches:
      - main
      - bugsv1
  pull_request:
    branches:
      - main
      - bugsv1

jobs:
  server-python:
    name: server-python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q

  server-typescript:
    name: server-typescript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test -- --run

  client-react:
    name: client-react tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --run
      - name: Build
        run: npm run build
