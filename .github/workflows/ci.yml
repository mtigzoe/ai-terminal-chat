name: CI

on:
  push:
    branches:
      - main
      - bugsv1
  pull_request:
    branches:
      - main
      - bugsv1

permissions:
  contents: write

jobs:
  security-maintenance:
    name: security maintenance
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply security maintenance patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          security = Path('server-typescript/src/security.ts')
          text = security.read_text()
          old_probe = '''const probeFd = openRelativeToDirFd(currentFd, part, {
            create: false,
            write: false,
          });'''
          new_probe = '''const probeFd = openRelativeToDirFd(currentFd, part, {
            create: false,
            write: false,
            directory: true,
          });'''
          old_next = '''nextFd = openRelativeToDirFd(currentFd, part, {
            create: false,
            write: false,
          });'''
          new_next = '''nextFd = openRelativeToDirFd(currentFd, part, {
            create: false,
            write: false,
            directory: true,
          });'''
          if text.count(old_probe) != 1 or text.count(old_next) != 1:
              raise SystemExit('security.ts expected traversal blocks were not found exactly once')
          text = text.replace(old_probe, new_probe).replace(old_next, new_next)
          security.write_text(text)

          git = Path('server-typescript/src/git.ts')
          text = git.read_text()
          old = '''        GIT_EXTERNAL_DIFF: "",
        GIT_ASKPASS: "",'''
          new = '''        // Do not set GIT_EXTERNAL_DIFF. Git treats an empty value as an
        // external diff command and then attempts to execute it.
        GIT_ASKPASS: "",'''
          if text.count(old) != 1:
              raise SystemExit('git.ts GIT_EXTERNAL_DIFF block was not found exactly once')
          text = text.replace(old, new)
          git.write_text(text)
          PY
      - name: Commit maintenance patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-typescript/src/security.ts server-typescript/src/git.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(security): repair Windows traversal and Git diff environment'
          git push

  server-python:
    name: server-python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q

  server-typescript:
    name: server-typescript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test -- --run

  client-react:
    name: client-react tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --run
      - name: Build
        run: npm run build
