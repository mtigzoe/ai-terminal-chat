name: CI

on:
  push:
    branches:
      - main
      - bugsv1
  pull_request:
    branches:
      - main
      - bugsv1

jobs:
  server-python:
    name: server-python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q

  server-typescript:
    name: server-typescript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test -- --run

  server-typescript-windows:
    name: server-typescript Windows security tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build test runtime
        run: npm run build
      - name: Run security regression tests
        run: npx tsx --test src/security.test.ts src/filesystem.test.ts src/terminal.git-isolation.test.ts src/trusted-exec.test.ts src/windows-handle-path.test.ts src/safe-fetch.test.ts

  client-react:
    name: client-react tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run Electron security regression tests
        run: |
          node tests/external-url.test.cjs
          node tests/project-path.test.cjs
      - name: Run tests
        run: npm test -- --run
      - name: Build
        run: npm run build

  electron-security-windows:
    name: Electron security tests on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Electron security regression tests
        working-directory: client-react
        run: |
          node tests/external-url.test.cjs
          node tests/project-path.test.cjs
