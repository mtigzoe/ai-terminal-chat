name: Apply Git SSH isolation fix

on:
  push:
    branches:
      - fix/git-ssh-isolation-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply source fix and regression test
        shell: python
        run: |
          from pathlib import Path

          path = Path("server-typescript/src/git.ts")
          text = path.read_text(encoding="utf-8")

          old = '''async function runGit(args: string[], timeout: number): Promise<{'''
          helper = '''/**
           * Use SSH without loading the user's SSH config. Git operations can
           * reach attacker-controlled repositories, so user SSH configuration
           * must not provide ProxyCommand/ProxyJump execution paths.
           */
          export function getGitSshCommand(): string {
            return process.platform === "win32"
              ? "ssh -F NUL -o ProxyCommand=none -o ProxyJump=none"
              : "ssh -F /dev/null -o ProxyCommand=none -o ProxyJump=none";
          }

          async function runGit(args: string[], timeout: number): Promise<{'''

          if old not in text:
              raise SystemExit("runGit insertion point not found")
          if "export function getGitSshCommand()" not in text:
              text = text.replace(old, helper, 1)

          old_env = '        GIT_SSH_COMMAND: "ssh",'
          new_env = '        GIT_SSH_COMMAND: getGitSshCommand(),'
          if old_env not in text:
              raise SystemExit("GIT_SSH_COMMAND assignment not found")
          text = text.replace(old_env, new_env, 1)
          path.write_text(text, encoding="utf-8")

          test = Path("server-typescript/src/git.ssh-isolation.test.ts")
          test.write_text('''import { describe, expect, test } from "vitest";\nimport { getGitSshCommand } from "./git.ts";\n\ndescribe("Git SSH isolation", () => {\n  test("does not load the user's SSH config or proxy commands", () => {\n    const command = getGitSshCommand();\n    const expectedConfig = process.platform === "win32" ? "NUL" : "/dev/null";\n\n    expect(command).toBe(\n      `ssh -F ${expectedConfig} -o ProxyCommand=none -o ProxyJump=none`,\n    );\n  });\n});\n''', encoding="utf-8")

      - name: Run TypeScript tests
        working-directory: server-typescript
        run: npm ci && npm test

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-typescript/src/git.ts server-typescript/src/git.ssh-isolation.test.ts .github/workflows/apply-git-ssh-isolation.yml
          git rm .github/workflows/apply-git-ssh-isolation.yml
          git commit -m "Fix Git SSH config execution boundary"
          git push origin HEAD:fix/git-ssh-isolation-v2
