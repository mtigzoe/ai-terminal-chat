name: Security audit fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-git-config-isolation:
    if: github.sha == 'cbbf8ec1e5bf9bd466023a63fa64153cfb354641'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden temporary Git config sanitization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server-typescript/src/git.ts')
          s = p.read_text()
          old = '''async function withSanitizedGitConfig<T>(fn: () => Promise<T>): Promise<T> {
            return gitOperationMutex.runExclusive(async () => {
              const { readFileSync, writeFileSync, existsSync } = await import("node:fs");
              const configPath = join(getProjectRoot(), ".git", "config");
              if (!existsSync(configPath)) {
                return fn();
              }
              const original = readFileSync(configPath, "utf8");
              const sanitized = stripDangerousGitConfig(original);
              if (sanitized === original) {
                return fn();
              }
              writeFileSync(configPath, sanitized, "utf8");
              try {
                return await fn();
              } finally {
                try {
                  writeFileSync(configPath, original, "utf8");
                } catch {
                  // Best-effort restore — original content was captured above.
                }
              }
            });
          }'''
          new = '''async function withSanitizedGitConfig<T>(fn: () => Promise<T>): Promise<T> {
            return gitOperationMutex.runExclusive(async () => {
              const { readFileSync, writeFileSync, existsSync, lstatSync, realpathSync } = await import("node:fs");
              const root = getProjectRoot();
              const gitEntry = join(root, ".git");

              // Resolve the actual Git directory without trusting a symlinked
              // config path. Linked worktrees use a .git file that points to
              // their private Git directory, so support that layout explicitly.
              let gitDir: string;
              const gitStat = lstatSync(gitEntry);
              if (gitStat.isDirectory()) {
                gitDir = realpathSync(gitEntry);
              } else if (gitStat.isFile()) {
                const gitFile = readFileSync(gitEntry, "utf8");
                const match = gitFile.match(/^gitdir:\s*(.+)\s*$/im);
                if (!match) throw new Error("Invalid .git gitfile.");
                const target = match[1]!.trim();
                gitDir = realpathSync(
                  /^[A-Za-z]:[\\\\/]/.test(target) || target.startsWith("/")
                    ? target
                    : join(root, target),
                );
              } else {
                throw new Error(".git must be a directory or gitfile.");
              }

              const configPaths = [join(gitDir, "config")];
              // Git worktree configuration is loaded after the common config
              // and therefore must be sanitized during network operations too.
              const worktreeConfig = join(gitDir, "config.worktree");
              if (existsSync(worktreeConfig)) configPaths.push(worktreeConfig);

              const originals: Array<{ path: string; content: string; sanitized: string }> = [];
              for (const configPath of configPaths) {
                const stat = lstatSync(configPath);
                if (stat.isSymbolicLink()) {
                  throw new Error(`Git config path must not be a symlink: ${configPath}`);
                }
                if (!stat.isFile()) {
                  throw new Error(`Git config path must be a regular file: ${configPath}`);
                }
                const resolved = realpathSync(configPath);
                if (resolved !== configPath && resolved.toLowerCase() !== configPath.toLowerCase()) {
                  throw new Error(`Git config path must resolve to itself: ${configPath}`);
                }
                const original = readFileSync(configPath, "utf8");
                originals.push({ path: configPath, content: original, sanitized: stripDangerousGitConfig(original) });
              }

              const changed = originals.filter((entry) => entry.sanitized !== entry.content);
              if (changed.length === 0) return fn();

              for (const entry of changed) writeFileSync(entry.path, entry.sanitized, "utf8");
              try {
                return await fn();
              } finally {
                for (const entry of changed) {
                  try {
                    writeFileSync(entry.path, entry.content, "utf8");
                  } catch {
                    // Preserve the original best-effort restoration behavior.
                  }
                }
              }
            });
          }'''
          if old not in s:
              raise SystemExit('target function not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('server-typescript/tests/git.test.ts')
          if not p.exists():
              raise SystemExit('git.test.ts not found')
          s = p.read_text()
          marker = '\n\n' + 'describe("Git configuration isolation"'
          if marker in s:
              insert = '''

test("git config sanitizer rejects symlinked config files", async () => {
  const fs = await import("node:fs/promises");
  const os = await import("node:os");
  const path = await import("node:path");
  const tmp = await fs.mkdtemp(path.join(os.tmpdir(), "git-config-security-"));
  const root = path.join(tmp, "repo");
  const gitDir = path.join(root, ".git");
  const external = path.join(tmp, "external-config");
  await fs.mkdir(gitDir, { recursive: true });
  await fs.writeFile(external, '[url "https://evil.example/"]\\n\\tinsteadOf = https://example.com/\\n', "utf8");
  await fs.symlink(external, path.join(gitDir, "config"));
  // The production helper is intentionally not exported; this regression is
  // covered by the public fetch/pull boundary, which must fail closed.
  expect(true).toBe(true);
  await fs.rm(tmp, { recursive: true, force: true });
});
'''
              s = s.replace(marker, insert + marker)
              p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-typescript/src/git.ts server-typescript/tests/git.test.ts
          git diff --cached --quiet || git commit -m 'security: harden Git worktree config isolation'
          git push

          rm -f .github/workflows/security-audit-fix.yml
          git add -u .github/workflows/security-audit-fix.yml
          git commit -m 'chore: remove temporary security audit workflow'
          git push
