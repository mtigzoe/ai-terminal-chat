name: Security audit fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-git-common-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden linked-worktree Git config isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('server-typescript/src/git.ts')
          s = p.read_text()
          pattern = r'''(?m)^    const configPaths = \[join\(gitDir, "config"\)\];\n    const worktreeConfig = join\(gitDir, "config\.worktree"\);\n    if \(existsSync\(worktreeConfig\)\) configPaths\.push\(worktreeConfig\);\n    const originals: Array<\{ path: string; content: string; sanitized: string \}> = \[\];'''
          replacement = '''    let commonDir = gitDir;
    const commondirPath = join(gitDir, "commondir");
    if (existsSync(commondirPath)) {
      const commonRef = readFileSync(commondirPath, "utf8").trim();
      if (!commonRef) throw new Error("Invalid Git commondir file.");
      commonDir = realpathSync(
        /^[A-Za-z]:[\\\\/]/.test(commonRef) || commonRef.startsWith("/")
          ? commonRef
          : join(gitDir, commonRef),
      );
    }
    const configPaths = [join(commonDir, "config")];
    const worktreeConfig = join(gitDir, "config.worktree");
    if (existsSync(worktreeConfig)) configPaths.push(worktreeConfig);
    const originals: Array<{ path: string; content: string; sanitized: string }> = [];'''
          updated, count = re.subn(pattern, replacement, s)
          if count != 1: raise SystemExit(f'target config block not found or ambiguous: {count}')
          p.write_text(updated, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-typescript/src/git.ts
          git commit -m 'security: harden Git common config isolation'
          git push
          git rm .github/workflows/security-audit-fix.yml
          git commit -m 'chore: remove temporary security audit workflow'
          git push
