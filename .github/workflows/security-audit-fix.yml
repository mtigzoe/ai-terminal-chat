name: Security audit fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-git-config-isolation:
    if: github.sha == '281d85636d6106ddc1614bb17b77cfda09f83d9a'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden temporary Git config sanitization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server-typescript/src/git.ts')
          s = p.read_text()
          old = '''async function withSanitizedGitConfig<T>(fn: () => Promise<T>): Promise<T> {
            return gitOperationMutex.runExclusive(async () => {
              const { readFileSync, writeFileSync, existsSync } = await import("node:fs");
              const configPath = join(getProjectRoot(), ".git", "config");
              if (!existsSync(configPath)) {
                return fn();
              }
              const original = readFileSync(configPath, "utf8");
              const sanitized = stripDangerousGitConfig(original);
              if (sanitized === original) {
                return fn();
              }
              writeFileSync(configPath, sanitized, "utf8");
              try {
                return await fn();
              } finally {
                try {
                  writeFileSync(configPath, original, "utf8");
                } catch {
                  // Best-effort restore — original content was captured above.
                }
              }
            });
          }'''
          new = '''async function withSanitizedGitConfig<T>(fn: () => Promise<T>): Promise<T> {
            return gitOperationMutex.runExclusive(async () => {
              const { readFileSync, writeFileSync, existsSync, lstatSync, realpathSync } = await import("node:fs");
              const root = getProjectRoot();
              const gitEntry = join(root, ".git");
              let gitDir: string;
              const gitStat = lstatSync(gitEntry);
              if (gitStat.isDirectory()) {
                gitDir = realpathSync(gitEntry);
              } else if (gitStat.isFile()) {
                const gitFile = readFileSync(gitEntry, "utf8");
                const match = gitFile.match(/^gitdir:\s*(.+)\s*$/im);
                if (!match) throw new Error("Invalid .git gitfile.");
                const target = match[1]!.trim();
                gitDir = realpathSync(/^[A-Za-z]:[\\\\/]/.test(target) || target.startsWith("/") ? target : join(root, target));
              } else {
                throw new Error(".git must be a directory or gitfile.");
              }
              const configPaths = [join(gitDir, "config")];
              const worktreeConfig = join(gitDir, "config.worktree");
              if (existsSync(worktreeConfig)) configPaths.push(worktreeConfig);
              const originals: Array<{ path: string; content: string; sanitized: string }> = [];
              for (const configPath of configPaths) {
                const stat = lstatSync(configPath);
                if (stat.isSymbolicLink()) throw new Error(`Git config path must not be a symlink: ${configPath}`);
                if (!stat.isFile()) throw new Error(`Git config path must be a regular file: ${configPath}`);
                const resolved = realpathSync(configPath);
                if (resolved !== configPath && resolved.toLowerCase() !== configPath.toLowerCase()) {
                  throw new Error(`Git config path must resolve to itself: ${configPath}`);
                }
                const original = readFileSync(configPath, "utf8");
                originals.push({ path: configPath, content: original, sanitized: stripDangerousGitConfig(original) });
              }
              const changed = originals.filter((entry) => entry.sanitized !== entry.content);
              if (changed.length === 0) return fn();
              for (const entry of changed) writeFileSync(entry.path, entry.sanitized, "utf8");
              try {
                return await fn();
              } finally {
                for (const entry of changed) {
                  try { writeFileSync(entry.path, entry.content, "utf8"); } catch { /* best effort */ }
                }
              }
            });
          }'''
          if old not in s: raise SystemExit('target function not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-typescript/src/git.ts
          git commit -m 'security: harden Git worktree config isolation'
          git push
