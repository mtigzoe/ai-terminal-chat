name: Security Git config fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply hardened Git config isolation
        shell: python
        run: |
          from pathlib import Path

          p = Path("server-python/tools.py")
          s = p.read_text(encoding="utf-8")

          if "import threading\nfrom contextlib import contextmanager\n" not in s:
              s = s.replace(
                  "import subprocess\nimport tempfile\n",
                  "import subprocess\nimport tempfile\nimport threading\nfrom contextlib import contextmanager\n",
                  1,
              )

          if "def _git_config_files() -> list[Path]:" not in s:
              marker = "_GIT_CONFIG_OVERRIDES = [\n"
              insert = '''_GIT_OPERATION_LOCK = threading.RLock()\n\n\ndef _git_config_files() -> list[Path]:\n    """Return local/worktree Git config files without following config symlinks."""\n    git_path = get_project_root() / ".git"\n    if git_path.is_dir():\n        git_dir = git_path.resolve()\n    elif git_path.is_file():\n        try:\n            line = next(\n                line for line in git_path.read_text(encoding="utf-8").splitlines()\n                if line.lower().startswith("gitdir:")\n            )\n            git_dir = (git_path.parent / line.split(":", 1)[1].strip()).resolve()\n        except (OSError, UnicodeDecodeError, StopIteration):\n            return []\n    else:\n        return []\n\n    paths: list[Path] = []\n    for name in ("config", "config.worktree"):\n        path = git_dir / name\n        try:\n            resolved = path.resolve(strict=True)\n            resolved.relative_to(git_dir)\n            if path.is_symlink() or not path.is_file():\n                continue\n            paths.append(path)\n        except (OSError, ValueError):\n            continue\n    return paths\n\n\ndef _strip_dangerous_git_config(content: str) -> str:\n    """Remove URL/filter/include sections before network Git operations."""\n    out: list[str] = []\n    skipping = False\n    for raw in content.splitlines(keepends=True):\n        stripped = raw.strip()\n        if stripped.startswith("[") and stripped.endswith("]"):\n            section = stripped[1:-1].strip().lower()\n            skipping = (\n                section == "url"\n                or section.startswith("url ")\n                or section == "filter"\n                or section.startswith("filter ")\n                or section == "include"\n                or section.startswith("includeif ")\n            )\n        if not skipping:\n            out.append(raw)\n    return "".join(out)\n\n\n@contextmanager\ndef _sanitized_git_config():\n    """Temporarily remove URL/filter/include config under the Git operation lock."""\n    with _GIT_OPERATION_LOCK:\n        backups: list[tuple[Path, str]] = []\n        try:\n            for path in _git_config_files():\n                original = path.read_text(encoding="utf-8")\n                sanitized = _strip_dangerous_git_config(original)\n                if sanitized != original:\n                    path.write_text(sanitized, encoding="utf-8")\n                    backups.append((path, original))\n            yield\n        finally:\n            for path, original in reversed(backups):\n                try:\n                    path.write_text(original, encoding="utf-8")\n                except OSError:\n                    pass\n\n\n'''
              if marker not in s:
                  raise SystemExit("Git config marker not found")
              s = s.replace(marker, insert + marker, 1)

          if "DYNAMIC_GIT_CONFIG_KEY_RE = re.compile(" not in s:
              marker = "def _git_ssh_command() -> str:\n"
              insert = '''DYNAMIC_GIT_CONFIG_KEY_RE = re.compile(\n    r"^(filter\\..+\\.(clean|smudge|process|required)|url\\..+\\.(insteadof|pushinsteadof)|include\\.path|includeif\\..+\\.path|merge\\..+\\.driver|remote\\..+\\.(uploadpack|receivepack)|diff\\..+\\.textconv|submodule\\..+\\.update)$",\n    re.IGNORECASE,\n)\n\n\ndef _dynamic_git_config_overrides() -> list[str]:\n    overrides: list[str] = []\n    for path in _git_config_files():\n        try:\n            section = ""\n            for raw in path.read_text(encoding="utf-8").splitlines():\n                line = raw.strip()\n                if not line or line.startswith("#") or line.startswith(";"):\n                    continue\n                if line.startswith("[") and line.endswith("]"):\n                    body = line[1:-1].strip()\n                    match = re.match(r'^(\\S+)\\s+"(.*)"$', body)\n                    section = f"{match.group(1).lower()}.{match.group(2)}" if match else body.lower()\n                    continue\n                match = re.match(r"^([^=]+)=", line)\n                if match and section:\n                    key = f"{section}.{match.group(1).strip().lower()}"\n                    if DYNAMIC_GIT_CONFIG_KEY_RE.fullmatch(key):\n                        overrides.extend(["-c", f"{key}="])\n        except (OSError, UnicodeDecodeError):\n            continue\n    return overrides\n\n\n'''
              if marker not in s:
                  raise SystemExit("SSH marker not found")
              s = s.replace(marker, insert + marker, 1)

          old = 'safe_args = list(_GIT_CONFIG_OVERRIDES) + list(args)'
          if old in s:
              s = s.replace(old, 'safe_args = list(_GIT_CONFIG_OVERRIDES) + _dynamic_git_config_overrides() + list(args)', 1)

          s = s.replace('args = ["git", "diff"]\n', 'args = ["git", "diff", "--no-ext-diff", "--no-textconv"]\n', 1)

          for call in [
              'result = _run_git(args[1:], timeout=GIT_FETCH_TIMEOUT)',
              'result = _run_git(args[1:], timeout=GIT_PULL_TIMEOUT)',
              'result = _run_git(args[1:], timeout=GIT_PUSH_TIMEOUT)',
          ]:
              if call in s and f'with _sanitized_git_config():\n            {call}' not in s:
                  s = s.replace(call, f'with _sanitized_git_config():\n            {call}', 1)

          p.write_text(s, encoding="utf-8")

          p = Path("server-typescript/src/git.ts")
          s = p.read_text(encoding="utf-8")
          old = r'  /^(filter\.\.+\.(clean|smudge|process|required)|url\.\.+\.(insteadof|pushinsteadof)|include\.path|includeif\.\.+\.path)$/i;'
          # Replace the exact current regex rather than relying on Python regex escaping.
          current = '  /^(filter\\..+\\.(clean|smudge|process|required)|url\\..+\\.(insteadof|pushinsteadof)|include\\.path|includeif\\..+\\.path)$/i;'
          hardened = '  /^(filter\\..+\\.(clean|smudge|process|required)|url\\..+\\.(insteadof|pushinsteadof)|include\\.path|includeif\\..+\\.path|merge\\..+\\.driver|remote\\..+\\.(uploadpack|receivepack)|diff\\..+\\.textconv|submodule\\..+\\.update)$/i;'
          if current in s:
              s = s.replace(current, hardened, 1)
          elif hardened not in s:
              raise SystemExit("TypeScript dynamic override regex not found")
          p.write_text(s, encoding="utf-8")

          # Replace the malformed temporary regression test with a syntax-safe version.
          p = Path("server-python/tests/test_git_config_security.py")
          lines = [
              "import subprocess",
              "import sys",
              "from pathlib import Path",
              "",
              "SERVER_DIR = Path(__file__).resolve().parents[1]",
              "sys.path.insert(0, str(SERVER_DIR))",
              "import tools  # noqa: E402",
              "",
              "def _git(cwd: Path, *args: str) -> subprocess.CompletedProcess:",
              "    return subprocess.run([\"git\", *args], cwd=cwd, text=True, capture_output=True, check=True)",
              "",
              "def _repo(tmp_path: Path) -> Path:",
              "    root = tmp_path / \"repo\"",
              "    root.mkdir()",
              "    _git(root, \"init\")",
              "    _git(root, \"config\", \"user.name\", \"Test\")",
              "    _git(root, \"config\", \"user.email\", \"test@example.com\")",
              "    (root / \"file.txt\").write_text(\"base\\n\", encoding=\"utf-8\")",
              "    _git(root, \"add\", \"file.txt\")",
              "    _git(root, \"commit\", \"-m\", \"base\")",
              "    return root",
              "",
              "def test_strip_dangerous_git_config_removes_execution_sections():",
              "    config = \"[core]\\n\\tbare = false\\n[filter \\\"evil\\\"]\\n\\tclean = sh -c \\\"touch pwned; cat\\\"\\n[url \\\"file:///evil/\\\"]\\n\\tinsteadOf = https://example.com/\\n[include]\\n\\tpath = evil.conf\\n[merge \\\"evil\\\"]\\n\\tdriver = sh -c \\\"touch merge-pwned\\\"\\n\"",
              "    sanitized = tools._strip_dangerous_git_config(config)",
              "    assert 'filter \"evil\"' not in sanitized",
              "    assert 'url \"file:///evil/\"' not in sanitized",
              "    assert '[include]' not in sanitized",
              "    assert 'merge \"evil\"' in sanitized",
              "",
              "def test_git_diff_disables_textconv(tmp_path, monkeypatch):",
              "    root = _repo(tmp_path)",
              "    (root / '.gitattributes').write_text('file.txt diff=evil\\n', encoding='utf-8')",
              "    _git(root, 'config', 'diff.evil.textconv', \"sh -c 'touch pwned; cat'\")",
              "    (root / 'file.txt').write_text('changed\\n', encoding='utf-8')",
              "    monkeypatch.setattr(tools, 'PROJECT_ROOT', root)",
              "    result = tools.git_diff('file.txt')",
              "    assert 'error' not in result",
              "    assert not (root / 'pwned').exists()",
              "",
              "def test_dynamic_git_config_overrides_execution_paths(tmp_path, monkeypatch):",
              "    root = _repo(tmp_path)",
              "    _git(root, 'config', 'filter.evil.clean', \"sh -c 'touch pwned; cat'\")",
              "    _git(root, 'config', 'merge.evil.driver', \"sh -c 'touch merge-pwned'\")",
              "    _git(root, 'config', 'remote.origin.uploadpack', 'touch upload-pwned')",
              "    monkeypatch.setattr(tools, 'PROJECT_ROOT', root)",
              "    flattened = ' '.join(tools._dynamic_git_config_overrides())",
              "    assert 'filter.evil.clean=' in flattened",
              "    assert 'merge.evil.driver=' in flattened",
              "    assert 'remote.origin.uploadpack=' in flattened",
          ]
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # Remove the now-obsolete first temporary workflow.
          Path(".github/workflows/security-git-config-audit.yml").unlink(missing_ok=True)

      - name: Verify
        run: |
          python -m py_compile server-python/tools.py server-python/tests/test_git_config_security.py
          python -m pytest -q server-python/tests/test_git_config_security.py
          cd server-typescript
          npm install --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server-python/tools.py server-python/tests/test_git_config_security.py server-typescript/src/git.ts .github/workflows/security-git-config-audit.yml
          git diff --cached --quiet && exit 0
          git commit -m "security: harden Git config execution isolation"
          git push origin main
