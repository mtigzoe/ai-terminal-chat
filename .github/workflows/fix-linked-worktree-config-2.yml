name: Fix linked worktree Git config 2

on:
  push:
    paths:
      - .github/workflows/fix-linked-worktree-config-2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch git.ts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server-typescript/src/git.ts')
          s = p.read_text(encoding='utf-8')
          old = '''    const configPaths = [join(gitDir, "config")];
    const worktreeConfig = join(gitDir, "config.worktree");
    if (existsSync(worktreeConfig)) configPaths.push(worktreeConfig);
'''
          new = '''    // Linked worktrees keep their private Git directory under the common
    // repository's .git/worktrees/<name>. Git may load the shared
    // $GIT_COMMON_DIR/config before the worktree-specific config.worktree.
    // Resolve and sanitize both locations so shared config cannot bypass the
    // execution/network isolation boundary.
    let commonDir = gitDir;
    const commondirPath = join(gitDir, "commondir");
    if (existsSync(commondirPath)) {
      const commonRef = readFileSync(commondirPath, "utf8").trim();
      if (!commonRef) throw new Error("Invalid Git commondir file.");
      const commonTarget = /^[A-Za-z]:[\\\\/]/.test(commonRef) || commonRef.startsWith("/")
        ? commonRef
        : join(gitDir, commonRef);
      commonDir = realpathSync(commonTarget);
    }
    const configPaths = [join(commonDir, "config")];
    const worktreeConfig = join(gitDir, "config.worktree");
    if (existsSync(worktreeConfig) && worktreeConfig !== configPaths[0]) configPaths.push(worktreeConfig);
'''
          if old not in s:
              raise SystemExit('Expected config block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-time workflows and commit
        run: |
          rm -f .github/workflows/fix-linked-worktree-config.yml .github/workflows/fix-linked-worktree-config-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-typescript/src/git.ts .github/workflows/fix-linked-worktree-config.yml .github/workflows/fix-linked-worktree-config-2.yml
          git commit -m 'Harden Git config isolation for linked worktrees'
          git push
