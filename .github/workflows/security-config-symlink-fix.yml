name: Security config symlink fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and verify
        shell: python
        run: |
          from pathlib import Path
          p = Path('server-python/tools.py')
          s = p.read_text(encoding='utf-8')
          old = '''        try:\n            resolved = path.resolve(strict=True)\n            resolved.relative_to(git_dir)\n            if path.is_symlink() or not path.is_file():\n                continue\n            paths.append(path)\n        except (OSError, ValueError):\n            continue\n'''
          new = '''        if path.is_symlink():\n            raise ValueError("Git config path must not be a symlink.")\n        try:\n            resolved = path.resolve(strict=True)\n        except FileNotFoundError:\n            continue\n        except OSError as exc:\n            raise ValueError(f"Could not inspect Git config path: {exc}") from exc\n        try:\n            resolved.relative_to(git_dir)\n        except ValueError as exc:\n            raise ValueError("Git config path escapes the Git directory.") from exc\n        if not path.is_file():\n            raise ValueError("Git config path must be a regular file.")\n        paths.append(path)\n'''
          if old not in s:
              raise SystemExit('config path block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('server-python/tests/test_git_config_security.py')
          s = p.read_text(encoding='utf-8')
          addition = '''\n\ndef test_git_config_symlink_is_rejected(tmp_path, monkeypatch):\n    root = tmp_path / "repo"\n    root.mkdir()\n    (root / "external-config").write_text("[filter \\\"evil\\\"]\\n\\tclean = touch pwned\\n", encoding="utf-8")\n    git_dir = root / ".git"\n    git_dir.mkdir()\n    (git_dir / "config").symlink_to(root / "external-config")\n    monkeypatch.setattr(tools, "PROJECT_ROOT", root)\n    try:\n        tools._git_config_files()\n    except ValueError as exc:\n        assert "symlink" in str(exc).lower()\n    else:\n        raise AssertionError("symlinked Git config must be rejected")\n'''
          if 'def test_git_config_symlink_is_rejected' not in s:
              p.write_text(s + addition, encoding='utf-8')

      - name: Verify
        run: |
          python -m py_compile server-python/tools.py server-python/tests/test_git_config_security.py
          python -m pip install -q pytest
          python -m pytest -q server-python/tests/test_git_config_security.py

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server-python/tools.py server-python/tests/test_git_config_security.py
          git commit -m "security: reject symlinked Git config" 
          git push origin main
