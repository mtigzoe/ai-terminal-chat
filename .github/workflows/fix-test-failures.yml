name: temporary fix test failures
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch TypeScript fetch typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server-typescript/src/safe-fetch.ts')
          s = p.read_text()
          old = '''    const fetchImpl = options.fetchImpl ?? globalThis.fetch;\n    const response = await fetchImpl(url.toString(), {\n      ...safeInit,\n      dispatcher: agent,\n    });'''
          new = '''    const fetchImpl = options.fetchImpl ?? globalThis.fetch;\n    const pinnedInit = {\n      ...safeInit,\n      dispatcher: agent,\n    } as RequestInit & { dispatcher: Agent };\n    const response = await fetchImpl(url.toString(), pinnedInit);'''
          if old not in s: raise SystemExit('safe-fetch typing pattern missing')
          p.write_text(s.replace(old, new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server-typescript/src/safe-fetch.ts
          git diff --cached --quiet || git commit -m "fix: type pinned fetch dispatcher"
          git push
