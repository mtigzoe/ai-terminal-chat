name: temporary fix test failures
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix final syntax issue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server-typescript/src/write-tools.ts')
          s = p.read_text().replace('''  return;\n\nexport function git_add''', '''  return;\n}\n\nexport function git_add''')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server-typescript/src/write-tools.ts
          git diff --cached --quiet || git commit -m "fix: close git staging helper"
          git push
