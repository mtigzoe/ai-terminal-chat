name: temporary fix test failures
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Ollama Python: shutil.which already guarantees the PATH target
          # exists; strict=True made mocked/test paths fail unnecessarily.
          p = Path('server-python/ollama.py')
          s = p.read_text().replace('Path(executable).resolve(strict=True)', 'Path(executable).resolve()')
          p.write_text(s)

          # Trusted executable resolution must use the target platform's PATH
          # delimiter when tests simulate Windows on a POSIX runner.
          p = Path('server-typescript/src/trusted-exec.ts')
          s = p.read_text()
          s = s.replace('import { delimiter, isAbsolute, join, resolve, sep } from "node:path";', 'import { delimiter, join, resolve } from "node:path";')
          s = s.replace('  return pathEnv.split(delimiter).map((dir) => dir.trim()).filter(Boolean);', '  const pathDelimiter = process.platform === "win32" ? ";" : delimiter;\n  return pathEnv.split(pathDelimiter).map((dir) => dir.trim()).filter(Boolean);')
          s = s.replace('  options: { projectRoot?: string | null } = {},', '  options: { projectRoot?: string | null; allowAbsolutePath?: boolean } = {},')
          old = '''  if (looksLikePath(name)) {\n    throw new TrustedExecutableError(\n      `Refusing path-qualified executable '${name}'. Use a bare command name from PATH.`,\n    );\n  }'''
          new = '''  if (looksLikePath(name) && !options.allowAbsolutePath) {\n    throw new TrustedExecutableError(\n      `Refusing path-qualified executable '${name}'. Use a bare command name from PATH.`,\n    );\n  }\n\n  if (looksLikePath(name) && options.allowAbsolutePath) {\n    const resolved = tryResolveFile(name);\n    if (!resolved) {\n      throw new TrustedExecutableError(`Executable '${name}' does not exist.`);\n    }\n    if (projectRootResolved && isPathWithinRoot(projectRootResolved, resolved)) {\n      throw new TrustedExecutableError(`Executable '${name}' resolves inside the project root.`);\n    }\n    return resolved;\n  }'''
          # projectRootResolved is declared below, so use a second insertion instead.
          if old in s:
              s = s.replace(old, '''  let pathQualifiedName: string | null = null;\n  if (looksLikePath(name)) {\n    if (!options.allowAbsolutePath) {\n      throw new TrustedExecutableError(\n        `Refusing path-qualified executable '${name}'. Use a bare command name from PATH.`,\n      );\n    }\n    pathQualifiedName = name;\n  }''')
          marker = '''  const dirs = pathDirectories();\n  const candidates: string[] = [];'''
          insertion = '''  if (pathQualifiedName) {\n    const resolved = tryResolveFile(pathQualifiedName);\n    if (!resolved) {\n      throw new TrustedExecutableError(`Executable '${pathQualifiedName}' does not exist.`);\n    }\n    if (projectRootResolved && isPathWithinRoot(projectRootResolved, resolved)) {\n      throw new TrustedExecutableError(`Executable '${pathQualifiedName}' resolves inside the project root.`);\n    }\n    return resolved;\n  }\n\n  const dirs = pathDirectories();\n  const candidates: string[] = [];'''
          if marker not in s: raise SystemExit('trusted-exec marker missing')
          s = s.replace(marker, insertion)
          p.write_text(s)

          # Ollama's documented Windows install fallback is an explicit,
          # canonical path, so use the trusted resolver's absolute-path mode.
          p = Path('server-typescript/src/ollama-cli.ts')
          s = p.read_text().replace('''        return resolveTrustedExecutable(candidate, {\n          projectRoot: getProjectRoot(),\n        });''', '''        return resolveTrustedExecutable(candidate, {\n          projectRoot: getProjectRoot(),\n          allowAbsolutePath: true,\n        });''')
          p.write_text(s)

          # Surface spawnSync errors instead of hiding the actual cause.
          p = Path('server-typescript/src/write-tools.ts')
          s = p.read_text().replace('''  } catch {\n    return { code: 1, stdout: "", stderr: "git command failed" };\n  } finally {''', '''  } catch (exc) {\n    const message = exc instanceof Error ? exc.message : String(exc);\n    return { code: 1, stdout: "", stderr: `git command failed: ${message}` };\n  } finally {''')
          p.write_text(s)

          # Simulated Windows tests must use a Windows PATH delimiter and
          # provide a trusted PowerShell executable in their fake PATH.
          p = Path('server-typescript/tests/ollama-cli.test.ts')
          s = p.read_text()
          s = s.replace('''function setTestPath(newPath: string) {\n  process.env.PATH = newPath;\n  process.env.Path = newPath;\n}''', '''function setTestPath(newPath: string) {\n  process.env.PATH = newPath;\n  process.env.Path = newPath;\n}\n\nfunction joinTestPath(...dirs: string[]): string {\n  const delimiter = process.platform === "win32" ? ";" : path.delimiter;\n  return dirs.join(delimiter);\n}''')
          s = s.replace('setTestPath(`${fakeBinDir}${path.delimiter}${originalPath.PATH}`);', 'setTestPath(joinTestPath(fakeBinDir, originalPath.PATH || ""));')
          s = s.replace('setTestPath(`${fakeBinDir}${path.delimiter}${originalPath.PATH}`);', 'setTestPath(joinTestPath(fakeBinDir, originalPath.PATH || ""));')
          # Add fake powershell.exe beside each Windows fake Ollama binary.
          s = s.replace('fs.writeFileSync(path.join(fakeBinDir, "ollama.exe"), "stub");\n    setTestPath(joinTestPath(fakeBinDir, originalPath.PATH || ""));', 'fs.writeFileSync(path.join(fakeBinDir, "ollama.exe"), "stub");\n    fs.writeFileSync(path.join(fakeBinDir, "powershell.exe"), "stub");\n    setTestPath(joinTestPath(fakeBinDir, originalPath.PATH || ""));')
          # Fallback launch: the PATH may contain PowerShell but not Ollama.
          s = s.replace('fs.writeFileSync(path.join(ollamaDir, "ollama.exe"), "stub");\n\n    const emptyPathDir', 'fs.writeFileSync(path.join(ollamaDir, "ollama.exe"), "stub");\n\n    const emptyPathDir')
          s = s.replace('const emptyPathDir = fs.mkdtempSync(path.join(os.tmpdir(), "ollama-cli-win-emptypath-"));\n    setTestPath(emptyPathDir);', 'const emptyPathDir = fs.mkdtempSync(path.join(os.tmpdir(), "ollama-cli-win-emptypath-"));\n    fs.writeFileSync(path.join(emptyPathDir, "powershell.exe"), "stub");\n    setTestPath(emptyPathDir);')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server-python/ollama.py server-typescript/src/trusted-exec.ts server-typescript/src/ollama-cli.ts server-typescript/src/write-tools.ts server-typescript/tests/ollama-cli.test.ts
          git diff --cached --quiet || git commit -m "fix: restore cross-platform executable test compatibility"
          git push
