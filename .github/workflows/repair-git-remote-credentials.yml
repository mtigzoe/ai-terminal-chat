name: Repair git remote credential leak

on:
  push:
    branches:
      - fix/git-remote-credential-leak

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/git-remote-credential-leak
          fetch-depth: 1

      - name: Patch source and add regression tests
        shell: python
        run: |
          from pathlib import Path

          source = Path("server-typescript/src/terminal.ts")
          text = source.read_text(encoding="utf-8")

          marker = '''function capOutput(value: string): {\n  value: string;\n  truncated: boolean;\n} {\n'''
          insertion = '''/**\n * Remove username/password userinfo from Git remote URLs before terminal\n * output can reach the model. Keep the remote host/path visible for useful\n * diagnostics while never exposing credentials embedded in the URL.\n */\nexport function sanitizeGitRemoteOutput(output: string): string {\n  return output.replace(\n    /\\b(?:https?|ssh|git|ftp|ftps):\\/\\/[^\\s]+/gi,\n    (value) => {\n      try {\n        const parsed = new URL(value);\n        if (!parsed.username && !parsed.password) return value;\n        parsed.username = "";\n        parsed.password = "";\n        return parsed.toString();\n      } catch {\n        // Preserve malformed-but-printable URLs while still removing the\n        // complete userinfo segment when possible.\n        return value.replace(\n          /^([a-z][a-z0-9+.-]*:\\/\\/)[^\\/\\s]*@/i,\n          "$1",\n        );\n      }\n    },\n  );\n}\n\n'''
          if "export function sanitizeGitRemoteOutput" not in text:
              if marker not in text:
                  raise SystemExit("capOutput marker not found")
              text = text.replace(marker, insertion + marker, 1)

          old = '''      const out = capOutput(String(result.stdout ?? ""));\n      const err = capOutput(String(result.stderr ?? ""));\n'''
          new = '''      const remoteOutput =\n        args[0].toLowerCase() === "remote"\n          ? sanitizeGitRemoteOutput(String(result.stdout ?? ""))\n          : String(result.stdout ?? "");\n      const out = capOutput(remoteOutput);\n      const err = capOutput(String(result.stderr ?? ""));\n'''
          if old not in text:
              raise SystemExit("terminal output block not found")
          text = text.replace(old, new, 1)
          source.write_text(text, encoding="utf-8")

          test = Path("server-typescript/tests/terminal.remote-url.test.ts")
          test.write_text('''import { describe, expect, test } from "vitest";\nimport { sanitizeGitRemoteOutput } from "../src/terminal.ts";\n\ndescribe("Git remote output credential sanitization", () => {\n  test("removes HTTPS username and password while preserving host and path", () => {\n    const output = "origin\\thttps://username:secret-token@example.com/owner/repo.git (fetch)";\n    const sanitized = sanitizeGitRemoteOutput(output);\n\n    expect(sanitized).toBe("origin\\thttps://example.com/owner/repo.git (fetch)");\n    expect(sanitized).not.toContain("username");\n    expect(sanitized).not.toContain("secret-token");\n  });\n\n  test("removes credentials when the password contains an at-sign", () => {\n    const output = "origin\\thttps://user:p%40ssword@example.com/repo.git (push)";\n\n    expect(sanitizeGitRemoteOutput(output)).toBe(\n      "origin\\thttps://example.com/repo.git (push)",\n    );\n  });\n\n  test("sanitizes SSH URLs with URL userinfo but leaves scp-style remotes alone", () => {\n    const output = [\n      "origin\\tssh://user:token@example.com/owner/repo.git (fetch)",\n      "upstream\\tgit@github.com:owner/repo.git (fetch)",\n    ].join("\\n");\n\n    const sanitized = sanitizeGitRemoteOutput(output);\n\n    expect(sanitized).toContain("origin\\tssh://example.com/owner/repo.git (fetch)");\n    expect(sanitized).toContain("upstream\\tgit@github.com:owner/repo.git (fetch)");\n    expect(sanitized).not.toContain("token");\n  });\n\n  test("does not change URLs without embedded credentials", () => {\n    const output = "origin\\thttps://github.com/owner/repo.git (fetch)";\n    expect(sanitizeGitRemoteOutput(output)).toBe(output);\n  });\n});\n''', encoding="utf-8")

      - name: Install server dependencies
        working-directory: server-typescript
        run: npm ci

      - name: Run remote URL regression test
        working-directory: server-typescript
        run: npx vitest run tests/terminal.remote-url.test.ts

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-git-remote-credentials.yml
          git add server-typescript/src/terminal.ts server-typescript/tests/terminal.remote-url.test.ts
          git commit -m "Fix git remote credential exposure"
          git push origin HEAD:fix/git-remote-credential-leak
