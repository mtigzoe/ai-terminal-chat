name: Security maintenance patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'Security maintenance:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified security fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          security = Path('server-typescript/src/security.ts')
          text = security.read_text()
          old = '''          const probeFd = openRelativeToDirFd(currentFd, part, {
            create: false,
            write: false,
          });'''
          new = '''          const probeFd = openRelativeToDirFd(currentFd, part, {
            create: false,
            write: false,
            directory: true,
          });'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one Windows existence-probe block, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''          nextFd = openRelativeToDirFd(currentFd, part, {
            create: false,
            write: false,
          });'''
          new = '''          nextFd = openRelativeToDirFd(currentFd, part, {
            create: false,
            write: false,
            directory: true,
          });'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one Windows child-directory block, found {text.count(old)}')
          text = text.replace(old, new)
          security.write_text(text)

          git = Path('server-typescript/src/git.ts')
          text = git.read_text()
          old = '''    const safeArgs = [...GIT_CONFIG_OVERRIDES, ...args];'''
          new = '''    const command = args[0] ?? "";
    const safeCommandArgs =
      command === "diff"
        ? [command, "--no-ext-diff", ...args.slice(1)]
        : args;
    const safeArgs = [...GIT_CONFIG_OVERRIDES, ...safeCommandArgs];'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one safeArgs declaration, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''      env: {
        ...process.env,'''
          new = '''      env: (() => {
        const safeEnv = { ...process.env };
        // Never let the inherited GIT_EXTERNAL_DIFF override Git's internal
        // diff implementation. An empty value is still considered set by Git
        // and causes it to try executing an empty command.
        delete safeEnv.GIT_EXTERNAL_DIFF;
        delete safeEnv.GIT_EXTERNAL_DIFF_TRUST_EXIT_CODE;
        return {
          ...safeEnv,'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one Git environment block, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''        PAGER: "cat",
      },
    });'''
          new = '''          PAGER: "cat",
        };
      })(),
    });'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one Git environment terminator, found {text.count(old)}')
          text = text.replace(old, new)
          git.write_text(text)
          PY

          npm --prefix server-typescript run typecheck
          npm --prefix server-typescript run test:unit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-typescript/src/security.ts server-typescript/src/git.ts
          git commit -m 'Security maintenance: fix Windows traversal and Git environment' || exit 0
          git push
