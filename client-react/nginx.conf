server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite multi-page build: chat (index.html) and settings.html
    location = /settings {
        try_files /settings.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Avoid caching the HTML entry points aggressively during iteration.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
