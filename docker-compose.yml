# Backend-only Compose setup.
# Frontend (Vite / Electron) remains on the host so the existing non-Docker
# workflow is unchanged. Ollama is not containerized; point OLLAMA_* at the
# host instance via host.docker.internal (Docker Desktop / Compose host-gateway).

services:
  backend:
    build:
      context: ./server-python
      dockerfile: Dockerfile
    image: ai-terminal-chat-backend:local
    container_name: ai-terminal-chat-backend
    ports:
      - "${PORT:-9000}:9000"
    environment:
      HOST: "0.0.0.0"
      PORT: "9000"
      PROVIDER: "${PROVIDER:-ollama}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}"
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-120}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      XAI_MODEL: "${XAI_MODEL:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
      KILO_API_KEY: "${KILO_API_KEY:-}"
      KILO_MODEL: "${KILO_MODEL:-}"
      # Optional: mount a host project and set this so tools operate on it.
      AI_TERMINAL_PROJECT_ROOT: "${AI_TERMINAL_PROJECT_ROOT:-/project}"
    extra_hosts:
      # Linux Docker Engine: map host.docker.internal to the host gateway.
      # Docker Desktop (Windows/macOS) already provides this name.
      - "host.docker.internal:host-gateway"
    volumes:
      # Host project directory for tool filesystem access (read/write).
      - "${HOST_PROJECT_PATH:-.}:/project"
      # Persist provider/project-root config outside the image.
      - ai-terminal-chat-config:/home/appuser/.ai-terminal-chat
    restart: unless-stopped

volumes:
  ai-terminal-chat-config:
